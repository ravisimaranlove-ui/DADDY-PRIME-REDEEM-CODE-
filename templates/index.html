<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DADDY PRIME - VIP Gaming Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #08080a radial-gradient(circle at top right, #240b0b, transparent 60%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            padding: 16px;
            padding-bottom: 50px;
        }

        /* VIP Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(22, 22, 26, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 42, 42, 0.35);
            box-shadow: 0 8px 24px rgba(255, 42, 42, 0.2);
            margin-bottom: 22px;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .avatar-wrap {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, #ff3b30, #ff9500);
            box-shadow: 0 0 16px rgba(255, 59, 48, 0.8);
        }
        .avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #111;
        }
        .logo-text {
            font-family: 'Teko', sans-serif;
            font-size: 26px;
            letter-spacing: 1.5px;
            line-height: 1;
            background: linear-gradient(90deg, #ff3b30, #ff9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .user-pill {
            background: linear-gradient(90deg, #1f1f24, #2a1515);
            border: 1px solid #ff3b3044;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            color: #ff9500;
        }
        .logout-btn { color: #888; text-decoration: none; font-size: 12px; margin-left: 8px; font-weight: 600; }

        /* Banner Title */
        .section-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        .section-bar span {
            font-size: 14px;
            letter-spacing: 1.5px;
            font-weight: 800;
            color: #aaa;
            text-transform: uppercase;
        }
        .live-tag {
            background: rgba(0, 230, 118, 0.15);
            color: #00e676;
            border: 1px solid #00e67655;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 700;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Premium Gaming Cards */
        .grid { display: grid; gap: 16px; }
        .card {
            background: linear-gradient(135deg, rgba(26, 26, 32, 0.9), rgba(16, 16, 20, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 59, 48, 0.4);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: linear-gradient(180deg, #00e676, #00b0ff);
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .val-tag {
            font-family: 'Teko', sans-serif;
            font-size: 28px;
            line-height: 1;
            color: #00e676;
            letter-spacing: 1px;
        }
        .server-badge {
            background: #ff3b3022;
            color: #ff5252;
            border: 1px solid #ff3b3044;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        /* Code Display Box */
        .code-box {
            background: #000;
            border-radius: 10px;
            padding: 12px;
            border: 1px dashed #ff950066;
            margin-bottom: 12px;
            text-align: center;
        }
        .code-content {
            font-family: monospace;
            font-size: 16px;
            color: #ffb300;
            font-weight: 800;
            letter-spacing: 2px;
        }

        /* Copy Button */
        .btn-action {
            background: linear-gradient(90deg, #ff1744, #ff5252);
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 23, 68, 0.4);
            transition: transform 0.1s;
        }
        .btn-action:active { transform: scale(0.98); }

        /* Custom Floating Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background: #111;
            color: #00e676;
            border: 1px solid #00e676;
            text-align: center;
            border-radius: 12px;
            padding: 14px;
            position: fixed;
            z-index: 1000;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.4);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        #toast.show {
            visibility: visible;
            animation: fadeInOut 2s ease-in-out;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; bottom: 10px; }
            15% { opacity: 1; bottom: 30px; }
            85% { opacity: 1; bottom: 30px; }
            100% { opacity: 0; bottom: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="avatar-wrap">
                <img src="/static/logo.png" alt="Daddy Prime">
            </div>
            <div class="logo-text">DADDY PRIME VIP</div>
        </div>
        <div>
            <span class="user-pill">{{ user }}</span>
            <a class="logout-btn" href="/logout">EXIT</a>
        </div>
    </header>

    <div class="section-bar">
        <span>⚡ SERVER: INDIA FAST DROP</span>
        <span class="live-tag">● 100% ACTIVE</span>
    </div>

    <div class="grid">
        {% for row in codes %}
        <div class="card">
            <div class="card-top">
                <span class="val-tag">{{ row[0] }}</span>
                <span class="server-badge">IN SERVER</span>
            </div>
            <div class="code-box">
                <span class="code-content" id="c-{{ loop.index }}">{{ row[1] }}</span>
            </div>
            <button class="btn-action" onclick="copyValue('c-{{ loop.index }}')">CLAIM & COPY CODE</button>
        </div>
        {% endfor %}
    </div>

    <div id="toast">✓ CODE COPIED TO CLIPBOARD!</div>

    <script>
        function copyValue(id) {
            var text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text);
            
            var toast = document.getElementById("toast");
            toast.innerText = "✓ COPIED: " + text;
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 2000);
        }
    </script>
</body>
</html>
