<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DADDY PRIME - Register</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: radial-gradient(circle, #081a10 0%, #050505 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(20, 20, 20, 0.85);
            border: 2px solid #00e676;
            border-radius: 16px;
            padding: 30px 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.25);
            text-align: center;
        }
        .card h1 {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(90deg, #00e676, #00b0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { color: #bbb; font-size: 12px; font-weight: 600; margin-bottom: 6px; display: block; }
        input {
            width: 100%;
            padding: 12px 14px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            outline: none;
        }
        input:focus { border-color: #00e676; }
        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(90deg, #00e676, #00b0ff);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 8px;
        }
        .link-text { color: #aaa; font-size: 13px; margin-top: 18px; }
        .link-text a { color: #00e676; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>JOIN DADDY PRIME</h1>
        <form method="POST">
            <div class="input-group">
                <label>CREATE USERNAME</label>
                <input type="text" name="username" placeholder="Pick username" required>
            </div>
            <div class="input-group">
                <label>CREATE PASSWORD</label>
                <input type="password" name="password" placeholder="Pick password" required>
            </div>
            <button class="btn" type="submit">CREATE VIP PASS</button>
        </form>
        <p class="link-text"><a href="/login">Back to Login</a></p>
    </div>
</body>
</html>
