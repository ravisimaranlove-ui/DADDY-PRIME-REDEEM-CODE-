<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DADDY PRIME - VIP Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: radial-gradient(circle, #1a0808 0%, #050505 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(20, 20, 20, 0.85);
            border: 2px solid #ff2a2a;
            border-radius: 16px;
            padding: 30px 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 0 25px rgba(255, 42, 42, 0.35);
            text-align: center;
            backdrop-filter: blur(8px);
        }
        .card h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ff3b30, #ff9500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .subtitle { color: #888; font-size: 13px; margin-bottom: 24px; letter-spacing: 1px; }
        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { color: #bbb; font-size: 12px; font-weight: 600; margin-bottom: 6px; display: block; }
        input {
            width: 100%;
            padding: 12px 14px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #ff2a2a; box-shadow: 0 0 8px rgba(255, 42, 42, 0.4); }
        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(90deg, #ff2a2a, #ff7b00);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 42, 42, 0.4);
            margin-top: 8px;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .link-text { color: #aaa; font-size: 13px; margin-top: 18px; }
        .link-text a { color: #ff3b30; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>⚡ DADDY PRIME ⚡</h1>
        <p class="subtitle">VIP REDEEM HUB</p>
        <form method="POST">
            <div class="input-group">
                <label>GAMER USERNAME</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>
            <div class="input-group">
                <label>SECRET KEY / PASSWORD</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button class="btn" type="submit">ENTER DASHBOARD</button>
        </form>
        <p class="link-text">Need an account? <a href="/register">Register here</a></p>
    </div>
</body>
</html>
